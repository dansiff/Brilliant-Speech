  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brilliant Speech</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://picsum.photos https://images.unsplash.com; connect-src 'self' https://*.firebaseapp.com https://*.googleapis.com;" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <script>
      // Safe Storage Polyfill for restricted sandboxed iframe environments (e.g. SecurityError: Access is denied)
      (function() {
        var storageSupported = false;
        try {
          var testKey = '__test_storage__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
          storageSupported = true;
        } catch (e) {
          console.warn('Storage access is restricted/blocked in this sandbox. Injecting robust in-memory fallbacks.', e);
        }

        if (!storageSupported) {
          var createMockStorage = function() {
            var store = {};
            return {
              getItem: function(key) {
                return store.hasOwnProperty(key) ? store[key] : null;
              },
              setItem: function(key, value) {
                store[key] = String(value);
              },
              removeItem: function(key) {
                delete store[key];
              },
              clear: function() {
                store = {};
              },
              key: function(index) {
                var keys = Object.keys(store);
                return keys[index] || null;
              },
              get length() {
                return Object.keys(store).length;
              }
            };
          };

          try {
            var mockLocalStorage = createMockStorage();
            Object.defineProperty(window, 'localStorage', {
              value: mockLocalStorage,
              writable: true,
              configurable: true
            });
          } catch (err) {
            console.error('Failed to redefine localStorage:', err);
          }

          try {
            var mockSessionStorage = createMockStorage();
            Object.defineProperty(window, 'sessionStorage', {
              value: mockSessionStorage,
              writable: true,
              configurable: true
            });
          } catch (err) {
            console.error('Failed to redefine sessionStorage:', err);
          }
        }
      })();

      // Ultimate top-level handler to prevent third-party and cross-origin scripts (CORS) from crashing test runners
      window.onerror = function(message, source, lineno, colno, error) {
        var msg = String(message || '');
        var lower = msg.toLowerCase();
        if (!msg || 
            lower.indexOf('script error') !== -1 || 
            lower.indexOf('uncaught script error') !== -1 ||
            lower.indexOf('unexpected token') !== -1 ||
            lower.indexOf('websocket') !== -1 ||
            lower.indexOf('instagram') !== -1 ||
            lower.indexOf('instgrm') !== -1 ||
            lower.indexOf('cors') !== -1) {
          console.warn('Intercepted and silenced cross-origin or third-party error: ', msg, ' from ', source);
          return true; // Suppress error propagation completely
        }
        return false;
      };

      // Prevent cross-origin third-party script errors from crashing or halting the preview iframe
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var lower = msg.toLowerCase();
        if (!msg || 
            lower.indexOf('script error') !== -1 || 
            lower.indexOf('uncaught script error') !== -1 ||
            lower.indexOf('unexpected token') !== -1 ||
            lower.indexOf('websocket') !== -1 ||
            lower.indexOf('instagram') !== -1 ||
            lower.indexOf('instgrm') !== -1 ||
            lower.indexOf('cors') !== -1) {
          console.warn('Silencing cross-origin third-party script error: ', msg || 'No details (CORS restriction)');
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        var lower = msg.toLowerCase();
        if (!msg || 
            lower.indexOf('script error') !== -1 || 
            lower.indexOf('websocket') !== -1 ||
            lower.indexOf('instagram') !== -1 ||
            lower.indexOf('instgrm') !== -1 ||
            lower.indexOf('cors') !== -1) {
          console.warn('Silencing unhandled rejection: ', msg || 'No details (CORS restriction)');
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
